[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-adaptive-ik"
version = "0.1.0"
description = "Residual Adaptive IK for MyCobot 280 (classical IK + bounded learning)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "spark_isaac_mycobot_v2 contributors" }]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pytest>=7.4",
]

[project.optional-dependencies]
learning = [
  "torch>=2.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
