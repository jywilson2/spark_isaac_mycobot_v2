model:
  hidden_sizes: [256, 256, 128]
  activation: relu
  output_limit_deg: 0.5
training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.00001
  seed: 42
loss:
  # Primary objective is matching Δq labels; keep magnitude penalty light so
  # the MLP does not collapse to near-zero residuals on mixed clean/noisy data.
  lambda_delta_q: 1.0
  lambda_residual_magnitude: 0.0001
  lambda_joint_limit: 10.0
dataset:
  train_path: assets/datasets/supervised_train.npz
  val_path: assets/datasets/supervised_val.npz
  test_path: assets/datasets/supervised_test.npz
  stress_path: assets/datasets/supervised_stress.npz
  # Prefer perturbation modes for training (clean kept light for no-degrade check).
  train_modes: [joint_bias, tool_frame, base_frame, target_noise, payload_sag, clean]
checkpoint_dir: assets/checkpoints/supervised_residual
