# Phase 2 — geometry + collision-aware joint planning (SI units).
#
# CI uses NumPy capsule–sphere + ground-plane checks (no GPU).
# Host Spark prefers NVIDIA cuRobo (Apache-2.0) MotionGen with
# mesh-fitted collision spheres (configs/planning/curobo/mycobot_280_collision_spheres.yaml).
# Regenerate fits: ./scripts/host/fit_mycobot_collision_spheres.sh

link_radius_m: 0.025
path_samples: 24
ignore_tip_segment_at_goal: true
enforce_collision_in_validation: true

# Ground plane height in the robot base frame (meters). Capsules whose
# lowest point (center−radius) is below this are in collision.
ground_z_m: -0.02

# Prefer cuRobo on host when CUDA is available.
prefer_curobo: true
curobo_interpolation_dt_s: 0.02
curobo_max_attempts: 4

# When cuRobo is available and rejects a plan, do NOT fall back to NumPy lerp
# for execution (capsules miss EE-side vs marker). CI uses prefer_curobo=false.
fallback_numpy_after_curobo_fail: false

# IK target marker is a volumetric sphere obstacle (see target_marker.py).
# Tip plans to marker surface; proximal EE/arm must not sweep through.
target_obstacle_enabled: true

# When planning fails, do not execute joint motion (freeze current pose).
gate_motion_on_plan_failure: true

# Return to home_joint_positions_rad before each viz / diagnostic trial.
# Disabled by default so path-dependent recovery strategies can be tested.
# Enable with: reset_to_home_before_each_trial: true
reset_to_home_before_each_trial: false

# After a direct plan fails, retry via standoff waypoints until timeout.
plan_recovery_enabled: true
# Wall-clock budget for recovery (seconds). Direct attempts are capped separately
# so a slow IK_FAIL cannot skip all vias.
plan_recovery_timeout_s: 15.0
plan_recovery_direct_max_attempts: 2
plan_recovery_via_max_attempts: 4
# Tip-to-marker-center clearances (meters) tried as via standoffs (nearest first).
plan_recovery_standoff_clearances_m: [0.05, 0.08, 0.12]
plan_recovery_surface_margin_m: 0.008
